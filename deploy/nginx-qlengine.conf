# qlengine 对外入口（由 deploy/deploy.sh proxy 生成，勿手改）：公网 __PORT__（TLS + BasicAuth）→ 127.0.0.1:7870
# 服务本身没有鉴权，只监听本机；对外只经这里。发版（install）不碰本文件。
limit_req_zone $binary_remote_addr zone=qlengine:1m rate=50r/s;

server {
    listen __PORT__ ssl;
    listen [::]:__PORT__ ssl;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/qlengine/cert.pem;
    ssl_certificate_key /etc/nginx/qlengine/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    auth_basic           "qlengine";
    auth_basic_user_file /etc/nginx/.htpasswd-qlengine;

    access_log /var/log/nginx/qlengine.access.log;     # 只记路径与大小，不记请求体
    error_log  /var/log/nginx/qlengine.error.log warn; # fail2ban qlengine-auth 读这里

    client_max_body_size 16m;                          # 一轮 iterate 实测单次 batch 最大 392KB
    limit_req zone=qlengine burst=200 nodelay;
    limit_req_status 429;

    location ~ ^/(health|functions|execute|execute/batch|compile)$ {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:7870;
        proxy_http_version 1.1;
        proxy_set_header Authorization "";            # 凭证不转给上游
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;                    # 与 rsi 客户端超时一致
    }
    location / { return 404; }
}
